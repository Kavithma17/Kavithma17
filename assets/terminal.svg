<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <!-- Terminal Background -->
  <rect x="0" y="0" width="800" height="200" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  
  <!-- Mac-style Window Controls -->
  <circle cx="20" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="20" r="6" fill="#27c93f"/>
  
  <!-- Top Bar Separator -->
  <path d="M 0 40 L 800 40" stroke="#30363d" stroke-width="1"/>
  
  <!-- Terminal Text -->
  <g font-family="-apple-system, Consolas, 'Courier New', monospace" font-size="16" fill="#c9d1d9">
    <!-- Command 1 -->
    <text x="20" y="80" fill="#7ee787">guest@kawithma:~$</text>
    <text x="180" y="80">whoami</text>
    
    <!-- Output -->
    <text x="20" y="110">Kawithma Rajapaksha</text>
    <text x="20" y="130">Software Engineering Intern @ WSO2 | Backend Developer</text>
    
    <!-- Command 2 -->
    <text x="20" y="165" fill="#7ee787">guest@kawithma:~$</text>
    
    <!-- Blinking Cursor -->
    <rect x="180" y="152" width="10" height="16" fill="#c9d1d9">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
